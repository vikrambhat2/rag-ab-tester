[project]
name = "rag-ab-tester"
version = "0.1.0"
description = "A/B testing framework for RAG pipelines with statistical comparison, powered by IBM WatsonX AI and OpenSearch."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3,<0.4",
    "langchain-community>=0.3,<0.4",
    "langchain-ibm>=0.3,<0.4",
    "langchain-openai>=0.3,<0.4",
    "langchain-text-splitters>=0.3,<0.4",
    "ibm-watsonx-ai>=1.1,<2",
    "opensearch-py>=2.4,<3",
    "pydantic>=2.0,<3",
    "scipy>=1.12,<2",
    "numpy>=1.26,<3",
    "rank-bm25>=0.2.2,<0.3",
    "rich>=13.7,<15",
    "python-dotenv>=1.0,<2",
    "tenacity>=8.2,<10",
]

[project.optional-dependencies]
# Sample dashboard only — not required for the CLI.
ui = [
    "streamlit>=1.35,<2",
    "plotly>=5.20,<7",
    "pandas>=2.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.uv]
# Scripts live at the repo root (run_experiment.py etc.); this is an application, not a library.
package = false

# ── Tooling ──────────────────────────────────────────────────────────────── #

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["integration: needs live WatsonX/OpenSearch credentials (skipped by default)"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["streamlit_app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "UP007", "UP045"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["streamlit_app/", "tests/"]
