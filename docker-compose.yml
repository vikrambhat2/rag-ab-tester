# Run the CLI in a container. Credentials come from your .env file (never baked into the image).
#
#   docker compose run --rm app rag-ab ingest
#   docker compose run --rm app rag-ab run-all --save-json
services:
  app:
    build: .
    env_file: .env
    volumes:
      - ./results:/app/results
      - ./data:/app/data
